[project]
name = "herz"
version = "0.1.0"
description = "曲の雰囲気（テンポ・音・声・リズムなど）で探す音楽検索サービスのバックエンド"
readme = "README.md"
authors = [
    { name = "koba-1423", email = "shungokobayashi.biz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "av>=19.0.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
clap = [
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["herz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = ["soundfile"]
ignore_missing_imports = true
