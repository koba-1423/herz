<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herz — 07 Tategaki</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="masthead">
      <span class="brand">ヘルツ <small>Herz</small></span>
      <span class="issue">第二〇〇号 · 二〇二六年 霜月</span>
    </header>

    <main class="spread">
      <section class="lead">
        <h1>音は、<br />言葉より<br />先に届く。</h1>
        <p class="body">
          名前も、時代も、ジャンルも知らなくていい。いまの心持ちをひとことで書けば、二十万の曲の中から、響きの似た一曲が静かに差し出されます。
        </p>
      </section>

      <section class="side">
        <form id="form" class="ask">
          <p class="kicker">— 今宵の気分を一筆 —</p>
          <input id="query" placeholder="雨の日に聴きたい静かなピアノ" />
          <button>聴いてみる</button>
          <div id="presets" class="presets"></div>
        </form>
        <ol id="results" class="list"></ol>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
