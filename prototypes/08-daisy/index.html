<!doctype html>
<html lang="ja" data-theme="herz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herz — 08 Friendly App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="min-h-screen bg-base-200">
    <div class="navbar bg-base-100 px-6 shadow-sm">
      <div class="flex-1 items-center gap-2 text-xl font-extrabold text-primary"><i data-lucide="audio-lines"></i> Herz</div>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-sm"><i data-lucide="heart" class="size-4"></i> お気に入り</button>
        <button class="btn btn-primary btn-sm rounded-full"><i data-lucide="sparkles" class="size-4"></i> 好みを分析</button>
      </div>
    </div>

    <main class="mx-auto max-w-6xl px-6 py-10">
      <section class="hero rounded-[2rem] bg-gradient-to-br from-primary to-secondary text-primary-content">
        <div class="hero-content w-full flex-col items-start px-10 py-14">
          <div class="badge badge-accent badge-lg font-bold">NEW · 日本語で探せるようになりました</div>
          <h1 class="mt-4 text-5xl leading-tight font-extrabold">きょうの気分、<br />なんて言う？</h1>
          <p class="opacity-90">ふわっとした言葉でOK。似た雰囲気の曲をすぐに見つけます。</p>
          <form id="form" class="join mt-6 w-full max-w-2xl shadow-xl">
            <label class="input join-item input-lg w-full border-0 text-base-content">
              <i data-lucide="search" class="size-5 opacity-50"></i>
              <input id="query" placeholder="朝のカフェ、アコースティック" />
            </label>
            <button class="btn btn-accent btn-lg join-item">さがす</button>
          </form>
          <div id="presets" class="mt-3 flex flex-wrap gap-2"></div>
        </div>
      </section>

      <div class="stats mt-8 w-full bg-base-100 shadow">
        <div class="stat"><div class="stat-figure text-primary"><i data-lucide="disc-3" class="size-8"></i></div><div class="stat-title">収録曲</div><div id="count" class="stat-value text-primary">200,000</div></div>
        <div class="stat"><div class="stat-figure text-secondary"><i data-lucide="globe" class="size-8"></i></div><div class="stat-title">国と地域</div><div class="stat-value text-secondary">20</div></div>
        <div class="stat"><div class="stat-figure text-accent"><i data-lucide="zap" class="size-8"></i></div><div class="stat-title">検索の速さ</div><div class="stat-value">0.03<span class="text-base">秒</span></div></div>
      </div>

      <h2 class="mt-10 mb-4 flex items-center gap-2 text-xl font-extrabold"><i data-lucide="music-2"></i> 見つかった曲</h2>
      <div id="results" class="grid grid-cols-2 gap-4 md:grid-cols-4"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
