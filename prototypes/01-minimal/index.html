<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herz — 01 Minimal</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-white text-neutral-900 antialiased">
    <header class="mx-auto flex max-w-6xl items-center justify-between px-8 py-8 text-sm">
      <span class="font-semibold tracking-tight">Herz</span>
      <nav class="flex gap-8 text-neutral-500">
        <a href="#" class="text-neutral-900">探す</a><a href="#">好み</a><a href="#">このサービスについて</a>
      </nav>
    </header>

    <main class="mx-auto max-w-6xl px-8">
      <section class="grid gap-16 pt-20 pb-24 md:grid-cols-[1.3fr_1fr]">
        <div>
          <p class="mb-6 text-xs tracking-[0.3em] text-neutral-400 uppercase">Music by vibe</p>
          <h1 class="text-6xl leading-[1.15] font-bold tracking-tight md:text-7xl">音楽を、<br />雰囲気で<br />探す。</h1>
        </div>
        <div class="flex flex-col justify-end">
          <p class="mb-10 leading-loose text-neutral-500">
            アーティスト名もジャンルも知らなくていい。<br />聴きたい気分を言葉にすると、<span id="count">20万</span>曲の中から近い曲が並びます。
          </p>
          <form id="form" class="flex items-end gap-4 border-b-2 border-neutral-900 pb-3">
            <input id="query" class="w-full bg-transparent text-xl outline-none placeholder:text-neutral-300" placeholder="雨の日に聴きたい静かなピアノ" />
            <button class="text-sm font-semibold whitespace-nowrap">探す →</button>
          </form>
          <div id="presets" class="mt-5 flex flex-wrap gap-x-5 gap-y-2 text-sm text-neutral-400"></div>
        </div>
      </section>

      <section class="border-t border-neutral-200 py-12">
        <div class="mb-8 flex items-baseline justify-between">
          <h2 class="text-sm font-semibold">「<span id="label"></span>」に近い曲</h2>
          <span class="text-xs text-neutral-400">似ている順</span>
        </div>
        <ol id="results" class="divide-y divide-neutral-100"></ol>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
