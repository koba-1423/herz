<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herz — 11 Paper</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-[#faf8f4] text-stone-800 antialiased">
    <main class="mx-auto max-w-2xl px-6 py-16">
      <header class="flex items-baseline justify-between text-sm text-stone-500">
        <span class="font-display text-2xl text-stone-900">Herz</span>
        <span id="count"></span>
      </header>
      <h1 class="font-display mt-24 text-5xl leading-snug text-stone-900">今日は、<br />どんな音を？</h1>
      <form id="form" class="mt-12 flex gap-3 border-b border-stone-300 pb-3">
        <input id="query" class="w-full bg-transparent text-lg outline-none placeholder:text-stone-300" placeholder="雨の日に聴きたい静かなピアノ" />
        <button class="text-sm whitespace-nowrap text-stone-500 hover:text-stone-900">探す</button>
      </form>
      <div id="presets" class="mt-4 flex flex-wrap gap-x-4 gap-y-1 text-sm text-stone-400"></div>
      <ol id="results" class="mt-16"></ol>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
